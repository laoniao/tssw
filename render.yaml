# Render 部署配置
# 文档：https://render.com/docs/yaml-spec
# 用法：在 Render 新建 Web Service 时选择 "Connect a repository"，
# 关联本仓库后，Render 会自动读取本文件。
services:
  - type: web
    name: shisheng-platform
    runtime: node
    region: oregon
    # 构建：安装前端依赖 -> 生产构建生成 dist/ -> 安装后端依赖
    buildCommand: npm install && npm run build && cd server && npm install
    # 启动：运行真实后端（它会自动托管 dist/ 并做 SPA 回退）
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 以下两个变量保证生产构建时前端走真实后端、跳过浏览器 mock
      - key: VITE_USE_REAL_API
        value: "true"
      - key: VITE_API_BASE_URL
        value: "/api"
      # 端口由 Render 自动注入，无需手动指定
